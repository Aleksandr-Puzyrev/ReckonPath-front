        moves: { type: integer }
        skips: { type: integer }
        timeouts: { type: integer }

    BoardView:
      type: object
      required: [rows, cols, terrain, fences, targets, bombs, revealed, taps]
      properties:
        rows: { type: integer }
        cols: { type: integer }
        terrain:
          type: array
          items: { type: string }
        fences:
          type: array
          items: { $ref: "#/components/schemas/Fence" }
        targets: { type: integer }
        bombs: { type: integer }
        revealed:
          type: array
          items: { $ref: "#/components/schemas/CellView" }
        taps: { $ref: "#/components/schemas/Cells" }
        secrets: { $ref: "#/components/schemas/Secrets" }

    MoveView:
      type: object
      required: [turn, by, kind, at]
      properties:
        turn: { type: integer, description: From 1; a skip after a bomb is a turn too }
        by: { type: string, enum: [me, rival] }
        cell: { $ref: "#/components/schemas/Cell" }
        kind: { type: string, enum: [number, buoy, target, bomb, timeout, skip] }
        at: { type: string, format: date-time }

    MatchResultView:
      type: object
      required: [outcome, reason, trophies, trophyNow, league, coins, gems, xp, rp]
      properties:
        outcome: { type: string, enum: [win, loss, draw] }
        reason:
          type: string
          enum: [targets, final, equal, timeouts, surrender, norm, abandoned, max_turns, cancelled]
        trophies: { type: integer }
        trophyNow: { type: integer }
        league: { $ref: "#/components/schemas/LeagueStep" }
        next: { $ref: "#/components/schemas/LeagueStep" }
        coins: { type: integer }
        gems: { type: integer }
        xp: { type: integer }
        rp: { type: integer }
        promotion:
          allOf:
            - $ref: "#/components/schemas/LeagueStep"
            - type: object
              required: [coins, gems]
              properties:
                coins: { type: integer }
                gems: { type: integer }

    MatchView:
      type: object
      required: [id, kind, status, seq, serverTime, format, me, rival, deadline, log]
      properties:
        id: { type: string }
        kind: { $ref: "#/components/schemas/MatchKind" }
        status: { type: string, enum: [prepare, play, done] }
        seq: { type: integer }
        serverTime: { type: string, format: date-time }
        format: { $ref: "#/components/schemas/MatchFormat" }
        me: { $ref: "#/components/schemas/PlayerView" }
        rival: { $ref: "#/components/schemas/PlayerView" }
        turn: { type: string, enum: [me, rival] }
        first: { type: string, enum: [me, rival] }
        final: { type: boolean }
        deadline: { type: string, format: date-time }
        startsAt: { type: string, format: date-time }
        norm: { type: integer }
        myMap: { $ref: "#/components/schemas/BoardView" }
        rivalMap: { $ref: "#/components/schemas/BoardView" }
        last: { $ref: "#/components/schemas/MoveView" }
        surrenderLoss: { type: integer }
        mapSeenByRival: { type: boolean }
        friendly: { type: boolean, description: A friendly challenge — no trophies or rewards }
        rivalOnline: { type: boolean, description: Duel only — the rival is connected }
        log:
          type: array
          description: Every move in order
          items: { $ref: "#/components/schemas/MoveView" }
        result: { $ref: "#/components/schemas/MatchResultView" }

    ArenaEvent:
      type: object
      description: A WebSocket push from /arena/ws (decision 0060 #8)
      required: [type, time]
      properties:
        type: { type: string, enum: [hello, match, queue, presence, challenge] }
        time: { type: string, format: date-time }
        match: { $ref: "#/components/schemas/MatchView" }
        queue: { $ref: "#/components/schemas/QueueState" }
        presence:
          type: object
          required: [matchId, online]
          properties:
            matchId: { type: string }
            online: { type: boolean, description: The rival is connected }
        challenge:
          type: object
          required: [id, status]
          properties:
            id: { type: string }
            status: { $ref: "#/components/schemas/ChallengeStatus" }

    ChallengeStatus:
      type: string
      enum: [pending, accepted, declined, cancelled, expired]

    ChallengeView:
      type: object
      required: [id, status, from, to, incoming, format, expiresAt]
      properties:
        id: { type: string }
        status: { $ref: "#/components/schemas/ChallengeStatus" }
        from: { $ref: "#/components/schemas/ChallengePlayer" }
        to: { $ref: "#/components/schemas/ChallengePlayer" }
        incoming: { type: boolean, description: The challenge is addressed to me }
        format: { $ref: "#/components/schemas/MatchFormat" }
        matchId: { type: string }
        expiresAt: { type: string, format: date-time }

    ChallengePlayer:
      type: object
      required: [name]
      properties:
        id: { type: string }
        name: { type: string }

    ChallengesResponse:
      type: object
      required: [incoming, outgoing]
      properties:
        incoming:
          type: array
          items: { $ref: "#/components/schemas/ChallengeView" }
        outgoing:
          type: array
          items: { $ref: "#/components/schemas/ChallengeView" }

    HistoryItem:
      type: object
      required: [matchId, kind, outcome, reason, rival, moves, rivalMoves, trophies, finishedAt]
      properties:
        matchId: { type: string }
        kind: { $ref: "#/components/schemas/MatchKind" }
        outcome: { type: string, enum: [win, loss, draw] }
        reason: { type: string }
        rival:
          type: object
          required: [name]
          properties:
            id: { type: string }
            name: { type: string }
            bot: { type: boolean }
        moves: { type: integer }
        rivalMoves: { type: integer }
        trophies: { type: integer }
        friendly: { type: boolean }
        finishedAt: { type: string, format: date-time }

    RewardItem:
      type: object
      required: [key, kind, title]
      properties:
        key: { type: string }
        kind: { type: string }
        title: { type: string }
        image: { type: string }

    TrackStepView:
      type: object
      required: [id, rp, coins, gems, state]
      properties:
        id: { type: integer }
        rp: { type: integer }
        coins: { type: integer }
        gems: { type: integer }
        item: { $ref: "#/components/schemas/RewardItem" }
        state: { type: string, enum: [locked, ready, claimed] }

    SeasonResult:
      type: object
      required: [number, peak, league, rank, wins, trophiesBefore, trophiesAfter, coins, gems]
      properties:
        number: { type: integer }
        peak: { type: integer }
        league: { $ref: "#/components/schemas/LeagueStep" }
        rank: { type: integer }
        wins: { type: integer }
        trophiesBefore: { type: integer }
        trophiesAfter: { type: integer }
        coins: { type: integer }
        gems: { type: integer }
        item: { $ref: "#/components/schemas/RewardItem" }

    SeasonView:
      type: object
      required: [number, startsAt, endsAt, rp, peak, track, ready]
      properties:
        number: { type: integer }
        startsAt: { type: string, format: date-time }
        endsAt: { type: string, format: date-time }
        rp: { type: integer }
        peak: { type: integer }
        track:
          type: array
          items: { $ref: "#/components/schemas/TrackStepView" }
        ready: { type: integer }
        result: { $ref: "#/components/schemas/SeasonResult" }

    SeasonClaim:
      type: object
      required: [coins, gems, wallet, season]
      properties:
        coins: { type: integer }
        gems: { type: integer }
        item: { $ref: "#/components/schemas/RewardItem" }
        wallet: { $ref: "#/components/schemas/BackendWallet" }
        season: { $ref: "#/components/schemas/SeasonView" }

    ArenaHome:
      type: object
      required:
        [
          serverTime,
          unlocked,
          unlockLevel,
          rulesSeen,
          trophies,
          rank,
          league,
          stats,
          maps,
          maxMaps,
          rewards,
          history,
          timing,
        ]
      properties:
        serverTime: { type: string, format: date-time }
        unlocked: { type: boolean }
        unlockLevel: { type: integer }
        rulesSeen: { type: boolean }
        trophies: { type: integer }
        rank: { type: integer }
        league: { $ref: "#/components/schemas/LeagueView" }
        stats: { $ref: "#/components/schemas/ArenaStats" }
        activeMap: { $ref: "#/components/schemas/ArenaMapView" }
        maps: { type: integer }
        maxMaps: { type: integer }
        rewards:
          type: object
          required: [winCoins, drawCoins, lossCoins, winGems, gemWinsLeft, botFactor]
          properties:
            winCoins: { type: integer }
            drawCoins: { type: integer }
            lossCoins: { type: integer }
            winGems: { type: integer }
            gemWinsLeft: { type: integer }
            botFactor: { type: integer }
        history:
          type: array
          items: { $ref: "#/components/schemas/HistoryItem" }
        match: { $ref: "#/components/schemas/MatchRef" }
        queue: { $ref: "#/components/schemas/QueueView" }
        timing:
          type: object
          required: [prepareSeconds, vsSeconds, mapOfferAfter, botAfter, maxTimeouts]
          properties:
            prepareSeconds: { type: integer }
            vsSeconds: { type: integer }
            mapOfferAfter: { type: integer }
            botAfter: { type: integer }
            maxTimeouts: { type: integer }
        season: { $ref: "#/components/schemas/SeasonView" }

    ArenaMapsList:
      type: object
      required: [format, maps, max]
      properties:
        format: { $ref: "#/components/schemas/MatchFormat" }
        maps:
          type: array
          items: { $ref: "#/components/schemas/ArenaMapView" }
        max: { type: integer }

    CustomLevelRequest:
      type: object
      required: [title, level]
      properties:
        title: { type: string, maxLength: 40, description: Trimmed by the server; may be empty }
        level: { $ref: "#/components/schemas/GameLevel" }

    CustomLevelView:
      type: object
      required: [id, title, level, updatedAt]
      properties:
        id: { type: string }
        title: { type: string }
        level: { $ref: "#/components/schemas/GameLevel" }
        updatedAt: { type: string, format: date-time }

    CustomLevelsList:
      type: object
      required: [levels, max]
      properties:
        levels:
          type: array
          items: { $ref: "#/components/schemas/CustomLevelView" }
        max: { type: integer }

    LevelProblem:
      type: object
      description: One item of details.problems of 422 level_invalid (game.Problem)
      required: [code, message]
      properties:
        code: { type: string }
        message: { type: string }
        cells: { $ref: "#/components/schemas/Cells" }
        element: { type: string }
        min: { type: integer }
        max: { type: integer }
        count: { type: integer }

    SupportTicket:
      type: object
      required: [topic, message, diagnostics]
      properties:
        topic: { type: string, enum: [ban_appeal, support] }
        message:
          { type: string, minLength: 1, maxLength: 1000, description: "Trimmed by the server" }
        diagnostics:
          type: object
          required: [appVersion, device]
          properties:
            appVersion: { type: string, maxLength: 40 }
            device: { type: string, maxLength: 120 }
            userId:
              {
                type: string,
                maxLength: 64,
                description: "Ignored by the server (decision 0064 #5)",
              }

    BanDetails:
      description: The banned error details (Part 7 §2)
      type: object
      required: [scope]
      properties:
        scope: { type: string, enum: [all, arena] }
        until: { type: [string, "null"], format: date-time }
        reason: { type: string }

    FriendStatus:
      type: string
      enum: [online, in_match, offline]

    FriendView:
      type: object
      required: [id, name, trophies, league]
      properties:
        id: { type: string }
        name: { type: string }
        country: { type: string }
        trophies: { type: integer }
        league: { type: string, description: Lower case, e.g. gold }
        status: { $ref: "#/components/schemas/FriendStatus" }
        since: { type: string, format: date-time }

    FriendRequestView:
      type: object
      required: [id, user, createdAt]
      properties:
        id: { type: string }
        user: { $ref: "#/components/schemas/FriendView" }
        createdAt: { type: string, format: date-time }

    FriendsList:
      type: object
      required: [friends, incoming, outgoing, counts]
      properties:
        friends:
          type: array
          items: { $ref: "#/components/schemas/FriendView" }
        incoming:
          type: array
          items: { $ref: "#/components/schemas/FriendRequestView" }
        outgoing:
          type: array
          items: { $ref: "#/components/schemas/FriendRequestView" }
        counts:
          type: object
          required: [friends, online, incoming]
          properties:
            friends: { type: integer }
            online: { type: integer, description: Online or in a match }
            incoming: { type: integer }

    FriendRelation:
      type: string
      enum: [none, friend, incoming, outgoing, blocked]

    FoundPlayer:
      allOf:
        - { $ref: "#/components/schemas/FriendView" }
        - type: object
          required: [relation]
          properties:
            relation: { $ref: "#/components/schemas/FriendRelation" }

    FriendRequestSent:
      type: object
      required: [status, requestId]
      properties:
        status: { type: string, enum: [sent, accepted] }
        requestId: { type: string }

    PlayerRelation:
      type: string
      enum: [self, friend, incoming, outgoing, blocked, none]

    HeadToHead:
      type: object
      required: [wins, losses, draws, last]
      properties:
        wins: { type: integer, description: My wins over this player }
        losses: { type: integer }
        draws: { type: integer }
        last:
          type: array
          description: Up to 10 last meetings, newest first
          items: { $ref: "#/components/schemas/HistoryItem" }

    PlayerProfile:
      type: object
      required: [id, name, trophies, rank, league, look, stats, relation]
      properties:
        id: { type: string }
        name: { type: string }
        trophies: { type: integer }
        rank: { type: integer, description: The world place by trophies }
        league: { $ref: "#/components/schemas/LeagueStep" }
        look: { $ref: "#/components/schemas/Look" }
        stats: { $ref: "#/components/schemas/ArenaStats" }
        headToHead: { $ref: "#/components/schemas/HeadToHead" }
        relation: { $ref: "#/components/schemas/PlayerRelation" }
        online: { type: boolean, description: For a friend only }

    ReportReason:
      type: string
      enum: [cheating, nickname, abuse, other]

    Invite:
      type: object
      required: [code, invited, rewarded, rewardGems, limit]
      properties:
        code: { type: string }
        invited: { type: integer }
        rewarded: { type: integer }
        rewardGems: { type: integer }
        limit: { type: integer }
        invitedBy: { type: string, description: The id of the player whose code I entered }
