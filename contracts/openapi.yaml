openapi: 3.1.0
info:
  title: Reckon Path API
  version: 1.0.0
  description: >
    Stage 2 subset of spec Part 7 (decision 0014 #2): bootstrap, guest auth, profile.
    Daily and streak follow the backend (decision 0061); friends follow the backend (decision 0062). Written from Part 7 by the client team,
    reviewed by the backend. Fields not stated in Part 7 are not added. `/auth/register`
    and `/auth/login` replace Part 7's Apple / Google sign-in and are a proposal to agree
    with the backend (decision 0019 #14). Shop, inventory and loadout follow Part 7 §6 with
    the additions of decision 0021, also to agree with the backend. Arena follows Part 7 §5 with
    the additions of decision 0029, to agree with the backend.
servers:
  - url: "{baseUrl}/v1"
    variables:
      baseUrl:
        default: ""
security:
  - bearer: []

paths:
  /bootstrap:
    get:
      operationId: getBootstrap
      security: [{}, { bearer: [] }]
      responses:
        "200":
          description: Start-up data
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Bootstrap" }
        default: { $ref: "#/components/responses/Error" }

  /version:
    get:
      operationId: getVersion
      description: >
        The backend compares the X-App-Version header with its minimum and current versions
        (decision 0049).
      security: [{}]
      responses:
        "200":
          description: Update flags and store links
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VersionInfo" }
        default: { $ref: "#/components/responses/Error" }

  /maintenance:
    get:
      operationId: getMaintenance
      security: [{}]
      responses:
        "200":
          description: Maintenance is on (decision 0058 #11)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Maintenance" }
        "204": { description: The app works }
        default: { $ref: "#/components/responses/Error" }

  /auth/register:
    post:
      operationId: authRegister
      description: Creates an unconfirmed account and e-mails a 6-digit code (decision 0050 #2).
      security: [{}]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RegisterRequest" }
      responses:
        "202":
          description: The code is sent
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CodeSent" }
        default: { $ref: "#/components/responses/Error" }

  /auth/register/resend:
    post:
      operationId: authRegisterResend
      security: [{}]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EmailRequest" }
      responses:
        "202":
          description: The code is sent again
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CodeSent" }
        default: { $ref: "#/components/responses/Error" }

  /auth/register/verify:
    post:
      operationId: authRegisterVerify
      description: Confirms the e-mail with the code and opens the account's session.
      security: [{}]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/VerifyRequest" }
      responses:
        "200":
          description: Session of the new account
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TokenPair" }
        default: { $ref: "#/components/responses/Error" }

  /auth/password/forgot:
    post:
      operationId: authPasswordForgot
      description: E-mails a code for a new password (decision 0053 #9).
      security: [{}]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EmailRequest" }
      responses:
        "202":
          description: The code is sent when the account exists
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CodeSent" }
        default: { $ref: "#/components/responses/Error" }

  /auth/password/reset:
    post:
      operationId: authPasswordReset
      description: Sets the new password by the code and ends every session of the account.
      security: [{}]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ResetPasswordRequest" }
      responses:
        "204": { description: The password is changed }
        default: { $ref: "#/components/responses/Error" }

  /auth/login:
    post:
      operationId: authLogin
      security: [{}]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoginRequest" }
      responses:
        "200":
          description: Session of the account
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TokenPair" }
        default: { $ref: "#/components/responses/Error" }

  /auth/logout-all:
    post:
      operationId: authLogoutAll
      description: Ends every session of the account, this one too (decision 0053 #14).
      responses:
        "204": { description: Signed out everywhere }
        default: { $ref: "#/components/responses/Error" }

  /auth/refresh:
    post:
      operationId: authRefresh
      security: [{}]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RefreshRequest" }
      responses:
        "200":
          description: New token pair
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TokenPair" }
        default: { $ref: "#/components/responses/Error" }

  /auth/logout:
    post:
      operationId: authLogout
      description: Ends the session of the bearer token.
      responses:
        "204": { description: Signed out }
        default: { $ref: "#/components/responses/Error" }

  /me:
    get:
      operationId: getMe
      responses:
        "200":
          description: Current player
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Me" }
        default: { $ref: "#/components/responses/Error" }
    patch:
      operationId: patchMe
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                locale: { type: string, enum: [ru, en] }
                nickname:
                  type: string
                  pattern: "^[A-Za-z0-9_]{3,16}$"
                  description: The first change is free, then nicknameChange.price; nickname rules in decision 0059 #2
      responses:
        "200":
          description: The updated player
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Me" }
        default: { $ref: "#/components/responses/Error" }
    delete:
      operationId: deleteMe
      description: Schedules the deletion, confirmed by the password; the session stays (decision 0058 #2).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password]
              properties:
                password: { type: string }
      responses:
        "202":
          description: When the data is erased for good
          content:
            application/json:
              schema:
                type: object
                required: [purgeAfter]
                properties:
                  purgeAfter: { type: string, format: date-time }
        default: { $ref: "#/components/responses/Error" }

  /me/consents:
    put:
      operationId: updateConsents
      description: Accepts the required consents or switches marketing; terms and privacy can only be accepted (decision 0056 #2, #3, #6).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateConsentsRequest" }
      responses:
        "200":
          description: The consents after the change
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ConsentsState" }
        default: { $ref: "#/components/responses/Error" }

  /me/password:
    put:
      operationId: changePassword
      description: Changes the password and ends the other sessions of the account (decision 0053 #11).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ChangePasswordRequest" }
      responses:
        "204": { description: The password is changed }
        default: { $ref: "#/components/responses/Error" }

  /me/email:
    post:
      operationId: changeEmail
      description: E-mails a code to the new address, confirmed by the current password.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ChangeEmailRequest" }
      responses:
        "202":
          description: The code is sent to the new address
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CodeSent" }
        default: { $ref: "#/components/responses/Error" }

  /me/email/confirm:
    post:
      operationId: confirmEmail
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code: { type: string, description: 6 digits from the e-mail }
      responses:
        "200":
          description: The e-mail is changed; the backend answers with its profile, which the client does not read
          content:
            application/json:
              schema: { type: object }
        default: { $ref: "#/components/responses/Error" }

  /me/devices:
    get:
      operationId: listDevices
      responses:
        "200":
          description: The devices the account is signed in on
          content:
            application/json:
              schema:
                type: object
                required: [devices]
                properties:
                  devices:
                    type: array
                    items: { $ref: "#/components/schemas/Device" }
        default: { $ref: "#/components/responses/Error" }

  /me/devices/{id}:
    delete:
      operationId: removeDevice
      description: Ends the session of that device and removes it.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "204": { description: The device is signed out }
        default: { $ref: "#/components/responses/Error" }

  /me/restore:
    post:
      operationId: restoreMe
      description: Cancels the scheduled deletion.
      responses:
        "200":
          description: Deletion cancelled, with the updated player
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Me" }
        default: { $ref: "#/components/responses/Error" }

  /daily:
    get:
      operationId: getDaily
      responses:
        "200":
          description: Today's daily, the streak and the rewards (decision 0061)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DailyOverview" }
        default: { $ref: "#/components/responses/Error" }

  /daily/{date}:
    get:
      operationId: getDailyDay
      parameters:
        - name: date
          in: path
          required: true
          schema: { type: string, format: date }
      responses:
        "200":
          description: My result and place for a past day or today
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DailyDay" }
        default: { $ref: "#/components/responses/Error" }

  /daily/history:
    get:
      operationId: getDailyHistory
      parameters:
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 90 }
      responses:
        "200":
          description: My won days, newest first
          content:
            application/json:
              schema:
                type: object
                required: [days]
                properties:
                  days:
                    type: array
                    items: { $ref: "#/components/schemas/DailyHistoryDay" }
        default: { $ref: "#/components/responses/Error" }

  /daily/leaderboard:
    get:
      operationId: getDailyLeaderboard
      parameters:
        - name: date
          in: query
          required: false
          schema: { type: string, format: date }
        - name: scope
          in: query
          required: false
          schema: { type: string, enum: [all, friends] }
      responses:
        "200":
          description: Up to 50 places of the day and mine
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DailyLeaderboard" }
        default: { $ref: "#/components/responses/Error" }

  /daily/play:
    post:
      operationId: playDaily
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                restart: { type: boolean }
      responses:
        "200":
          description: The unfinished game of the day, or a new attempt
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DailyGame" }
        default: { $ref: "#/components/responses/Error" }

  /daily/games/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    get:
      operationId: getDailyGame
      responses:
        "200":
          description: The whole game
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DailyGame" }
        default: { $ref: "#/components/responses/Error" }

  /daily/games/{id}/tap:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    post:
      operationId: tapDailyGame
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TapRequest" }
      responses:
        "200":
          description: The opened cell and the game after it
          content:
            application/json:
              schema:
                type: object
                required: [cell, game]
                properties:
                  cell: { $ref: "#/components/schemas/CellView" }
                  game: { $ref: "#/components/schemas/DailyGame" }
        default: { $ref: "#/components/responses/Error" }

  /streak:
    get:
      operationId: getStreak
      responses:
        "200":
          description: The streak of days
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StreakView" }
        default: { $ref: "#/components/responses/Error" }

  /streak/restore:
    post:
      operationId: restoreStreak
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                method: { type: string, enum: [gems] }
      responses:
        "200":
          description: The restored streak
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StreakView" }
        default: { $ref: "#/components/responses/Error" }

  /shop:
    get:
      operationId: getShop
      description: The backend showroom (decision 0055); the client groups the flat list itself.
      responses:
        "200":
          description: Catalog for the player
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ShopCatalog" }
        default: { $ref: "#/components/responses/Error" }

  /shop/items/{key}/buy:
    post:
      operationId: buyShopItem
      description: Buys an item or a bundle at the price the player saw.
      parameters:
        - { name: key, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [price, currency]
              properties:
                price: { type: integer }
                currency: { $ref: "#/components/schemas/ShopCurrency" }
      responses:
        "200":
          description: Purchase granted
          content:
            application/json:
              schema:
                type: object
                required: [item, granted, wallet]
                properties:
                  item: { $ref: "#/components/schemas/ShopItemView" }
                  granted:
                    type: array
                    items: { type: string }
                  wallet: { $ref: "#/components/schemas/BackendWallet" }
        default: { $ref: "#/components/responses/Error" }

  /me/items:
    get:
      operationId: getMyItems
      responses:
        "200":
          description: Owned items, default ones included, and what is equipped
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Inventory" }
        default: { $ref: "#/components/responses/Error" }

  /me/equipment:
    put:
      operationId: putEquipment
      description: Equips one slot; an empty item returns the default one.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [slot]
              properties:
                slot: { $ref: "#/components/schemas/ShopKind" }
                item: { type: string }
      responses:
        "200":
          description: The inventory after the change
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Inventory" }
        default: { $ref: "#/components/responses/Error" }

  /wallet:
    get:
      operationId: getWallet
      responses:
        "200":
          description: Coins and emeralds (gems)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BackendWallet" }
        default: { $ref: "#/components/responses/Error" }

  /ads/limits:
    get:
      operationId: getAdLimits
      description: Today's rewarded ad counters (decision 0025 #2, to agree with the backend).
      responses:
        "200":
          description: Counters per placement
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdLimits" }
        default: { $ref: "#/components/responses/Error" }

  /ads/intent:
    post:
      operationId: postAdIntent
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [placement]
              properties:
                placement: { $ref: "#/components/schemas/AdPlacement" }
                ref: { type: string, description: attemptId or eventId }
      responses:
        "200":
          description: Intent to show a rewarded ad
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdIntent" }
        default: { $ref: "#/components/responses/Error" }

  /ads/intent/{id}:
    get:
      operationId: getAdIntent
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Intent status after the SSV callback
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdIntentStatus" }
        default: { $ref: "#/components/responses/Error" }

  /arena:
    get:
      operationId: getArena
      responses:
        "200":
          description: The arena home (decision 0060 #9)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ArenaHome" }
        default: { $ref: "#/components/responses/Error" }

  /arena/maps:
    get:
      operationId: getArenaMaps
      responses:
        "200":
          description: Up to three maps and the league format
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ArenaMapsList" }
        default: { $ref: "#/components/responses/Error" }
    post:
      operationId: postArenaMap
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ArenaMapInput" }
      responses:
        "200":
          description: The saved map; an invalid one is a draft with problems
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ArenaMapView" }
        default: { $ref: "#/components/responses/Error" }

  /arena/maps/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    put:
      operationId: putArenaMap
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ArenaMapInput" }
      responses:
        "200":
          description: The saved map
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ArenaMapView" }
        default: { $ref: "#/components/responses/Error" }
    delete:
      operationId: deleteArenaMap
      responses:
        "204": { description: Deleted }
        default: { $ref: "#/components/responses/Error" }

  /arena/maps/{id}/activate:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    post:
      operationId: activateArenaMap
      responses:
        "200":
          description: The new active map; an invalid one is 422 map_invalid
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ArenaMapView" }
        default: { $ref: "#/components/responses/Error" }

  /arena/maps/random:
    post:
      operationId: randomArenaMap
      responses:
        "200":
          description: A valid random map of the league format, not saved
          content:
            application/json:
              schema:
                type: object
                required: [level]
                properties:
                  level: { $ref: "#/components/schemas/GameLevel" }
        default: { $ref: "#/components/responses/Error" }

  /arena/matches/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    get:
      operationId: getArenaMatch
      responses:
        "200":
          description: The match; a finished one has both maps with secrets
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MatchView" }
        default: { $ref: "#/components/responses/Error" }

  /campaign:
    get:
      operationId: getCampaign
      responses:
        "200":
          description: Campaign overview, worlds and levels (decision 0060 #2)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CampaignOverview" }
        default: { $ref: "#/components/responses/Error" }

  /campaign/levels/{number}:
    parameters:
      - { name: number, in: path, required: true, schema: { type: integer } }
    get:
      operationId: getCampaignLevel
      responses:
        "200":
          description: The level sheet with its public board
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CampaignLevelDetail" }
        default: { $ref: "#/components/responses/Error" }

  /campaign/levels/{number}/play:
    parameters:
      - { name: number, in: path, required: true, schema: { type: integer } }
    post:
      operationId: playCampaignLevel
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                restart: { type: boolean }
      responses:
        "200":
          description: The unfinished game of the level, or a new one
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CampaignGame" }
        default: { $ref: "#/components/responses/Error" }

  /campaign/games/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    get:
      operationId: getCampaignGame
      responses:
        "200":
          description: The whole game
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CampaignGame" }
        default: { $ref: "#/components/responses/Error" }

  /campaign/games/{id}/tap:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    post:
      operationId: tapCampaignGame
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TapRequest" }
      responses:
        "200":
          description: The opened cell and the game after it
          content:
            application/json:
              schema:
                type: object
                required: [cell, game]
                properties:
                  cell: { $ref: "#/components/schemas/CellView" }
                  game: { $ref: "#/components/schemas/CampaignGame" }
        default: { $ref: "#/components/responses/Error" }

  /campaign/games/{id}/continue:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    post:
      operationId: continueCampaignGame
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [seq]
              properties:
                seq: { type: integer }
      responses:
        "200":
          description: The game with +3 moves
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CampaignGame" }
        default: { $ref: "#/components/responses/Error" }

  /campaign/games/{id}/give-up:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    post:
      operationId: giveUpCampaignGame
      responses:
        "200":
          description: The abandoned game with its secrets
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CampaignGame" }
        default: { $ref: "#/components/responses/Error" }

  /campaign/tutorials:
    post:
      operationId: postCampaignTutorial
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [key]
              properties:
                key: { type: string, pattern: "^[a-z0-9_]{1,40}$" }
      responses:
        "204": { description: Saved }
        default: { $ref: "#/components/responses/Error" }

  /arena/rules-seen:
    put:
      operationId: putArenaRulesSeen
      responses:
        "204": { description: Saved }
        default: { $ref: "#/components/responses/Error" }

  /arena/maps/check:
    post:
      operationId: checkArenaMap
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [level]
              properties:
                level: { $ref: "#/components/schemas/GameLevel" }
      responses:
        "200":
          description: Validity, problems and the bot run
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MapCheck" }
        default: { $ref: "#/components/responses/Error" }

  /arena/queue:
    get:
      operationId: getArenaQueue
      responses:
        "200":
          description: The search state
          content:
            application/json:
              schema: { $ref: "#/components/schemas/QueueState" }
        default: { $ref: "#/components/responses/Error" }
    post:
      operationId: joinArenaQueue
      responses:
        "200":
          description: In the search, or the match already found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/QueueState" }
        default: { $ref: "#/components/responses/Error" }
    delete:
      operationId: leaveArenaQueue
      responses:
        "204": { description: Left the search }
        default: { $ref: "#/components/responses/Error" }

  /arena/map-match:
    post:
      operationId: startMapMatch
      responses:
        "200":
          description: A «против карты» match
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MatchView" }
        default: { $ref: "#/components/responses/Error" }

  /arena/matches/current:
    get:
      operationId: getCurrentMatch
      responses:
        "200":
          description: The live match
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MatchView" }
        default: { $ref: "#/components/responses/Error" }

  /arena/matches/{id}/map:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    put:
      operationId: putMatchMap
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - type: object
                  required: [source, level]
                  properties:
                    source: { type: string, const: draw }
                    level: { $ref: "#/components/schemas/GameLevel" }
                - type: object
                  required: [source, mapId]
                  properties:
                    source: { type: string, const: saved }
                    mapId: { type: string }
                - type: object
                  required: [source]
                  properties:
                    source: { type: string, const: random }
      responses:
        "200":
          description: The match with the chosen map
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MatchView" }
        default: { $ref: "#/components/responses/Error" }

  /arena/matches/{id}/ready:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    post:
      operationId: postMatchReady
      responses:
        "200":
          description: The match after «Готов»
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MatchView" }
        default: { $ref: "#/components/responses/Error" }

  /arena/matches/{id}/tap:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    post:
      operationId: postMatchTap
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TapRequest" }
      responses:
        "200":
          description: The match after the tap
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MatchView" }
        default: { $ref: "#/components/responses/Error" }

  /arena/matches/{id}/surrender:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    post:
      operationId: postMatchSurrender
      responses:
        "200":
          description: The finished match
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MatchView" }
        default: { $ref: "#/components/responses/Error" }

  /arena/history:
    get:
      operationId: getArenaHistory
      parameters:
        - { name: limit, in: query, required: false, schema: { type: integer, maximum: 50 } }
        - { name: before, in: query, required: false, schema: { type: string, format: date-time } }
      responses:
        "200":
          description: Finished matches, newest first
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/HistoryItem" }
                  nextBefore: { type: string, format: date-time }
        default: { $ref: "#/components/responses/Error" }

  /arena/season:
    get:
      operationId: getArenaSeason
      responses:
        "200":
          description: The current season and its track
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SeasonView" }
        default: { $ref: "#/components/responses/Error" }

  /arena/season/track/{step}/claim:
    parameters:
      - { name: step, in: path, required: true, schema: { type: integer } }
    post:
      operationId: claimSeasonTrackStep
      responses:
        "200":
          description: The reward of the step
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SeasonClaim" }
        default: { $ref: "#/components/responses/Error" }

  /arena/season/result/claim:
    post:
      operationId: claimSeasonResult
      responses:
        "200":
          description: The reward of the past season
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SeasonClaim" }
        default: { $ref: "#/components/responses/Error" }

  /support/tickets:
    post:
      operationId: createSupportTicket
      description: >
        A support request from an account; it passes under a full ban (decision 0064 #1). The ban
        appeal uses topic ban_appeal (decision 0038 #5). The answer comes by email (decision 0064 #4).
        Errors validation_failed (also for unknown fields), tickets_limit (5 per rolling 24 h),
        too_many_requests, rate_limit_unavailable.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SupportTicket" }
      responses:
        "200":
          description: The created ticket
          content:
            application/json:
              schema:
                type: object
                required: [ticketId]
                properties:
                  ticketId: { type: string }
        "422": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }

  /friends:
    get:
      operationId: listFriends
      description: Friends (online, then in_match, then offline), my incoming and outgoing requests (decision 0062).
      responses:
        "200":
          description: Friends, requests and counts
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FriendsList" }
        default: { $ref: "#/components/responses/Error" }

  /friends/search:
    get:
      operationId: searchFriends
      description: Up to 20 players whose nickname starts with the text (from 3 characters), the exact match first.
      parameters:
        - name: nickname
          in: query
          required: true
          schema: { type: string, minLength: 3 }
      responses:
        "200":
          description: The found players with my relation to each
          content:
            application/json:
              schema:
                type: object
                required: [users]
                properties:
                  users:
                    type: array
                    items: { $ref: "#/components/schemas/FoundPlayer" }
        default: { $ref: "#/components/responses/Error" }

  /friends/requests:
    post:
      operationId: sendFriendRequest
      description: >
        A friend request; when that player has already asked me, we become friends at once
        (status accepted). Errors user_not_found, friend_self, already_friends, request_exists,
        friends_limit, requests_limit.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [userId]
              properties:
                userId: { type: string }
      responses:
        "200":
          description: Sent, or accepted at once
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FriendRequestSent" }
        default: { $ref: "#/components/responses/Error" }

  /friends/requests/{id}/accept:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    post:
      operationId: acceptFriendRequest
      description: Errors request_not_found, friends_limit.
      responses:
        "204": { description: We are friends }
        default: { $ref: "#/components/responses/Error" }

  /friends/requests/{id}/decline:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    post:
      operationId: declineFriendRequest
      description: Error request_not_found.
      responses:
        "204": { description: Declined }
        default: { $ref: "#/components/responses/Error" }

  /friends/requests/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    delete:
      operationId: withdrawFriendRequest
      description: Withdraws my own request; error request_not_found.
      responses:
        "204": { description: Withdrawn }
        default: { $ref: "#/components/responses/Error" }

  /friends/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string }, description: The player id }
    delete:
      operationId: removeFriend
      description: Error not_friends.
      responses:
        "204": { description: Removed }
        default: { $ref: "#/components/responses/Error" }

  /friends/{id}/challenge:
    parameters:
      - {
          name: id,
          in: path,
          required: true,
          schema: { type: string },
          description: The friend's id,
        }
    post:
      operationId: challengeFriend
      description: >
        A friendly duel without trophies or rewards (decision 0062 #5); the friend gets the challenge
        push and the socket event. A new challenge silently cancels my previous pending one. Errors
        not_friends, arena_locked (details.level), banned, match_in_progress (details {id, kind,
        status}), rival_busy, season_changing, validation_failed (league).
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                league: { type: string, description: A league not above mine; empty — my own }
      responses:
        "200":
          description: The pending challenge
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChallengeView" }
        default: { $ref: "#/components/responses/Error" }

  /arena/challenges:
    get:
      operationId: listChallenges
      description: My pending, unexpired challenges. The socket does not replay them, so the client re-reads them on every (re)connect.
      responses:
        "200":
          description: Incoming and outgoing challenges
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChallengesResponse" }
        default: { $ref: "#/components/responses/Error" }

  /arena/challenges/{id}/accept:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    post:
      operationId: acceptChallenge
      description: >
        Creates the friendly match (friendly true) in the prepare phase. Errors challenge_not_found,
        match_in_progress, rival_busy, season_changing, arena_locked, banned.
      responses:
        "200":
          description: The friendly match
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MatchView" }
        default: { $ref: "#/components/responses/Error" }

  /arena/challenges/{id}/decline:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    post:
      operationId: declineChallenge
      description: Error challenge_not_found.
      responses:
        "204": { description: Declined }
        default: { $ref: "#/components/responses/Error" }

  /arena/challenges/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    delete:
      operationId: cancelChallenge
      description: Cancels my own challenge; error challenge_not_found.
      responses:
        "204": { description: Cancelled }
        default: { $ref: "#/components/responses/Error" }

  /me/invite:
    get:
      operationId: getInvite
      description: My invite code; the inviter gets rewardGems when the friend plays the first arena match, up to limit.
      responses:
        "200":
          description: My code and who invited me
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Invite" }
        default: { $ref: "#/components/responses/Error" }
    post:
      operationId: redeemInvite
      description: >
        Enters a friend's invite code once, within the first days after sign-up; the players
        become friends. Errors invite_invalid, invite_used, invite_expired, invite_self.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code: { type: string, maxLength: 16 }
      responses:
        "204": { description: Redeemed }
        default: { $ref: "#/components/responses/Error" }

  /arena/players/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string }, description: The player id }
    get:
      operationId: getPlayerProfile
      description: >
        Another player's arena profile (decision 0066): trophies, league, world place, stats, head to
        head with me (absent for myself and for a player I blocked), my relation to the player and,
        for a friend only, whether he is online. Error player_not_found.
      responses:
        "200":
          description: The player profile
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlayerProfile" }
        default: { $ref: "#/components/responses/Error" }

  /users/{id}/block:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string }, description: The player id }
    post:
      operationId: blockUser
      description: >
        Idempotent. Removes the friendship, cancels the requests both ways and the pair's challenges;
        afterwards neither finds the other in search, sends a request or challenges. Errors
        friend_self, user_not_found.
      responses:
        "204": { description: Blocked }
        default: { $ref: "#/components/responses/Error" }
    delete:
      operationId: unblockUser
      description: Idempotent.
      responses:
        "204": { description: Unblocked }
        default: { $ref: "#/components/responses/Error" }

  /users/{id}/report:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string }, description: The player id }
    post:
      operationId: reportUser
      description: >
        A report to the moderators; one per player per UTC day. matchId is kept only when both played
        that match. Errors report_duplicate, friend_self, user_not_found, too_many_requests.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { $ref: "#/components/schemas/ReportReason" }
                comment: { type: string, maxLength: 500 }
                matchId: { type: string }
      responses:
        "204": { description: Reported }
        default: { $ref: "#/components/responses/Error" }

  /me/blocks:
    get:
      operationId: listBlocks
      description: The players I blocked, newest first (since is the block time), up to 500.
      responses:
        "200":
          description: The blocked players
          content:
            application/json:
              schema:
                type: object
                required: [users]
                properties:
                  users:
                    type: array
                    items: { $ref: "#/components/schemas/FriendView" }
        default: { $ref: "#/components/responses/Error" }

  /levels/custom:
    get:
      operationId: listCustomLevels
      description: The player's own levels, newest first (decision 0063 #1).
      responses:
        "200":
          description: The levels and the account limit
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CustomLevelsList" }
        default: { $ref: "#/components/responses/Error" }
    post:
      operationId: createCustomLevel
      description: >-
        Saves a new level. Errors 409 limit_reached (details.max), 422 level_invalid
        (details.problems — LevelProblem[]), 422 validation_failed (title over 40 characters,
        rows or cols outside 4–9).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CustomLevelRequest" }
      responses:
        "200":
          description: The saved level
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CustomLevelView" }
        default: { $ref: "#/components/responses/Error" }

  /levels/custom/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
    get:
      operationId: getCustomLevel
      description: One own level; 404 level_not_found for an unknown id or another player's level.
      responses:
        "200":
          description: The level
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CustomLevelView" }
        default: { $ref: "#/components/responses/Error" }
    put:
      operationId: updateCustomLevel
      description: Replaces the level; errors as on create, plus 404 level_not_found.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CustomLevelRequest" }
      responses:
        "200":
          description: The saved level
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CustomLevelView" }
        default: { $ref: "#/components/responses/Error" }
    delete:
      operationId: deleteCustomLevel
      description: 404 level_not_found for an unknown id.
      responses:
        "200": { description: Deleted (an empty success) }
        default: { $ref: "#/components/responses/Error" }

components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer

  responses:
    Error:
      description: Error envelope (Part 7 §1, codes in §2)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }

  schemas:
    Platform:
      type: string
      enum: [ios, android]

    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code]
          properties:
            code: { $ref: "#/components/schemas/ErrorCode" }
            message: { type: string }
            details:
              type: object
              additionalProperties: true

    ErrorCode:
      type: string
      enum:
        - validation_failed
        - unauthenticated
        - session_revoked
        - banned
        - forbidden
        - not_found
        - idempotency_mismatch
        - idempotency_in_progress
        - invalid_idempotency_key
        - not_scheduled
        - already_owned
        - in_match
        - already_queued
        - nick_taken
        - nick_change_cooldown
        - not_owned
        - map_active
        - email_taken
        - invalid_credentials
        - account_conflict
        - insufficient_funds
        - offer_ended
        - sold_out
        - price_changed
        - limit_reached
        - map_invalid
        - level_invalid
        - attempt_rejected
        - streak_not_restorable
        - friends_limit
        - link_required
        - app_update_required
        - too_many_requests
        - maintenance
        - internal_error
        - invalid_token
        - invalid_refresh_token
        - refresh_token_reused
        - invalid_json
        - route_not_found
        - document_not_found
        - device_not_found
        - level_not_found
        - game_not_found
        - not_linked
        - server_busy
        - not_enough_gems
        - not_enough_coins
        - item_not_found
        - app_update_needed
        - cannot_continue
        - account_exists
        - already_linked
        - identity_taken
        - provider_already_linked
        - last_login_method
        - concurrent_signin
        - missing_provider_params
        - oauth_rejected
        - provider_not_supported
        - provider_unavailable
        - email_not_verified
        - email_required
        - same_email
        - invalid_code
        - too_many_attempts
        - password_required
        - wrong_password
        - reauth_required
        - required_consent
        - no_device
        - no_push_tokens
        - level_locked
        - cell_open
        - invalid_cell
        - game_over
        - game_not_lost
        - stale_game
        - daily_done
        - daily_unavailable
        - unknown_pack
        - not_in_pack
        - captcha_failed
        - captcha_unavailable
        - invalid_app_version
        - invalid_document_type
        - body_too_large
        - method_not_allowed
        - continue_method
        - arena_locked
        - arena_unavailable
        - maps_limit
        - map_not_found
        - match_not_found
        - match_in_progress
        - match_not_preparing
        - already_ready
        - stale_state
        - not_your_turn
        - match_not_playing
        - match_starting
        - step_not_found
        - step_locked
        - step_claimed
        - no_season_result
        - friend_self
        - already_friends
        - request_exists
        - requests_limit
        - user_not_found
        - request_not_found
        - not_friends
        - invite_invalid
        - invite_used
        - invite_expired
        - invite_self
        - rival_busy
        - challenge_not_found
        - season_changing
        - tickets_limit
        - rate_limit_unavailable
        - player_not_found
        - report_duplicate

    VersionInfo:
      type: object
      required: [showModal, forceUpdate, minVersion, currentVersion, ruStore, playMarket, appStore]
      properties:
        showModal: { type: boolean, description: Soft update is offered }
        forceUpdate: { type: boolean, description: The app must be updated }
        minVersion: { type: string }
        currentVersion: { type: string }
        title: { type: string, description: Not shown; the client uses its own texts }
        description: { type: string, description: Not shown; the client uses its own texts }
        buttonText: { type: string, description: Not shown; the client uses its own texts }
        ruStore: { type: string, description: Store link; empty when not set }
        playMarket: { type: string, description: Store link; empty when not set }
        appStore: { type: string, description: Store link; empty when not set }
    Maintenance:
      type: object
      required: [until, message]
      properties:
        until: { type: [string, "null"], format: date-time, description: null without an end time }
        message: { type: string }
    Bootstrap:
      type: object
      required: [serverTime, maintenance, config, contentVersion, adsNetwork, dayKey, nextDayAt]
      properties:
        serverTime: { type: string, format: date-time }
        maintenance:
          description: null when there is no maintenance
          oneOf:
            - type: "null"
            - $ref: "#/components/schemas/Maintenance"
        config:
          type: object
          additionalProperties: true
        contentVersion: { type: string }
        adsNetwork: { type: string, description: Empty when ads are off }
        dayKey: { type: string, format: date }
        nextDayAt: { type: string, format: date-time }

    TokenPair:
      type: object
      required: [accessToken, refreshToken, expiresIn]
      properties:
        accessToken: { type: string }
        refreshToken: { type: string }
        expiresIn: { type: integer }

    DeviceInfo:
      type: object
      required: [deviceId, platform]
      properties:
        deviceId: { type: string, description: Persistent install id }
        platform: { $ref: "#/components/schemas/Platform" }
        name: { type: string, description: Device model }
        appVersion: { type: string }

    LoginRequest:
      type: object
      required: [email, password, device]
      properties:
        email: { type: string, format: email }
        password: { type: string }
        device: { $ref: "#/components/schemas/DeviceInfo" }

    RegisterRequest:
      type: object
      required: [email, password, nickname, acceptTerms, acceptPrivacy, acceptMarketing]
      properties:
        email: { type: string, format: email }
        password: { type: string, minLength: 8 }
        nickname: { type: string, pattern: "^[A-Za-z0-9_]{3,16}$" }
        acceptTerms: { type: boolean }
        acceptPrivacy: { type: boolean }
        acceptMarketing: { type: boolean }

    EmailRequest:
      type: object
      required: [email]
      properties:
        email: { type: string, format: email }

    VerifyRequest:
      type: object
      required: [email, code, device]
      properties:
        email: { type: string, format: email }
        code: { type: string, description: 6 digits from the e-mail }
        device: { $ref: "#/components/schemas/DeviceInfo" }

    Device:
      type: object
      required: [id, deviceId, platform, isCurrent, lastSeenAt]
      properties:
        id: { type: string }
        deviceId: { type: string, description: Persistent install id }
        platform: { type: string, description: "ios, android or web" }
        name: { type: string, description: Device model }
        appVersion: { type: string }
        isCurrent: { type: boolean }
        lastSeenAt: { type: string, format: date-time }

    ChangePasswordRequest:
      type: object
      required: [currentPassword, newPassword]
      properties:
        currentPassword: { type: string }
        newPassword: { type: string, minLength: 8 }

    ChangeEmailRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string }

    ResetPasswordRequest:
      type: object
      required: [email, code, password]
      properties:
        email: { type: string, format: email }
        code: { type: string, description: 6 digits from the e-mail }
        password: { type: string, minLength: 8 }

    CodeSent:
      type: object
      required: [resendAfter]
      properties:
        resendAfter: { type: integer, description: Seconds until the code can be sent again }

    RefreshRequest:
      type: object
      required: [refreshToken]
      properties:
        refreshToken: { type: string }

    Wallet:
      type: object
      required: [emeralds, coins]
      properties:
        emeralds: { type: integer }
        coins: { type: integer }

    Me:
      type: object
      description: The backend's player (decision 0058); the wallet comes from GET /wallet
      required:
        [
          id,
          nickname,
          locale,
          level,
          xp,
          xpToNext,
          nicknameChange,
          flags,
          consents,
          consentsRequired,
        ]
      properties:
        id: { type: string }
        nickname: { type: string }
        locale: { type: string, enum: [ru, en] }
        level: { type: integer }
        xp: { type: integer, description: XP inside the current level }
        xpToNext: { type: integer }
        arena:
          type: object
          required: [trophies, league, division]
          properties:
            trophies: { type: integer }
            league: { type: string, description: Lower case, e.g. gold }
            division: { type: string, enum: [III, II, I] }
        nicknameChange:
          type: object
          required: [price, currency]
          properties:
            price: { type: integer, description: 0 when free }
            currency: { type: string }
            availableAt: { type: string, format: date-time }
        flags:
          type: object
          required: [deletionScheduledAt]
          properties:
            deletionScheduledAt: { type: [string, "null"], format: date-time }
            purgeAfter:
              {
                type: string,
                format: date-time,
                description: Until then the deletion can be cancelled,
              }
            bans:
              type: array
              description: Active bans (decision 0060 #14)
              items: { $ref: "#/components/schemas/BanDetails" }
        consents:
          type: array
          items: { $ref: "#/components/schemas/Consent" }
        consentsRequired:
          type: array
          items: { $ref: "#/components/schemas/ConsentType" }

    ConsentType:
      type: string
      enum: [terms, privacy, marketing]

    Consent:
      type: object
      required: [type, accepted, version]
      properties:
        type: { $ref: "#/components/schemas/ConsentType" }
        accepted: { type: boolean }
        version: { type: string, description: Version of the document }
        updatedAt: { type: string, format: date-time }

    UpdateConsentsRequest:
      type: object
      required: [consents]
      properties:
        consents:
          type: array
          minItems: 1
          items:
            type: object
            required: [type, accepted]
            properties:
              type: { $ref: "#/components/schemas/ConsentType" }
              accepted: { type: boolean }

    ConsentsState:
      type: object
      required: [consents, consentsRequired]
      properties:
        consents:
          type: array
          items: { $ref: "#/components/schemas/Consent" }
        consentsRequired:
          type: array
          items: { $ref: "#/components/schemas/ConsentType" }

    Cell:
      type: array
      prefixItems:
        - { type: integer }
        - { type: integer }
      minItems: 2
      maxItems: 2

