openapi: 3.1.0
info:
  title: Reckon Path API
  version: 1.0.0
  description: >
    Stage 2 subset of spec Part 7 (decision 0014 #2): bootstrap, guest auth, profile,
    attempts, progress, continue, daily, streak. Written from Part 7 by the client team,
    reviewed by the backend. Fields not stated in Part 7 are not added. `/auth/register`
    and `/auth/login` replace Part 7's Apple / Google sign-in and are a proposal to agree
    with the backend (decision 0019 #14). Shop, inventory and loadout follow Part 7 §6 with
    the additions of decision 0021, also to agree with the backend.
servers:
  - url: "{baseUrl}/v1"
    variables:
      baseUrl:
        default: ""
security:
  - bearer: []

paths:
  /bootstrap:
    get:
      operationId: getBootstrap
      security: [{}, { bearer: [] }]
      responses:
        "200":
          description: Start-up data
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Bootstrap" }
        default: { $ref: "#/components/responses/Error" }

  /auth/guest:
    post:
      operationId: authGuest
      security: [{}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [deviceId, platform]
              properties:
                deviceId: { type: string }
                platform: { $ref: "#/components/schemas/Platform" }
                integrityToken: { type: string }
      responses:
        "201":
          description: Guest session
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Session" }
        default: { $ref: "#/components/responses/Error" }

  /auth/register:
    post:
      operationId: authRegister
      description: Turns the current guest into a permanent account (decision 0019 #14).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RegisterRequest" }
      responses:
        "200":
          description: The guest is now a permanent account
          content:
            application/json:
              schema:
                type: object
                required: [user]
                properties:
                  user: { $ref: "#/components/schemas/SessionUser" }
        default: { $ref: "#/components/responses/Error" }

  /auth/login:
    post:
      operationId: authLogin
      description: >
        Signs in to an existing account; the caller decides whether to keep the new session
        (decision 0019 #14).
      security: [{}, { bearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoginRequest" }
      responses:
        "200":
          description: Session of the account and a summary of its progress
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LoginResult" }
        default: { $ref: "#/components/responses/Error" }

  /auth/refresh:
    post:
      operationId: authRefresh
      security: [{}]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RefreshRequest" }
      responses:
        "200":
          description: New token pair
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TokenPair" }
        default: { $ref: "#/components/responses/Error" }

  /auth/logout:
    post:
      operationId: authLogout
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RefreshRequest" }
      responses:
        "204": { description: Signed out }
        default: { $ref: "#/components/responses/Error" }

  /me:
    get:
      operationId: getMe
      responses:
        "200":
          description: Current player
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Me" }
        default: { $ref: "#/components/responses/Error" }

  /attempts:batch:
    post:
      operationId: postAttemptsBatch
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [attempts]
              properties:
                attempts:
                  type: array
                  maxItems: 50
                  items: { $ref: "#/components/schemas/Attempt" }
      responses:
        "200":
          description: Result per attempt and the final state
          content:
            application/json:
              schema:
                type: object
                required: [results, progress, wallet]
                properties:
                  results:
                    type: array
                    items: { $ref: "#/components/schemas/AttemptResult" }
                  progress:
                    type: object
                    required: [currentLevel, totalStars]
                    properties:
                      currentLevel: { type: integer }
                      totalStars: { type: integer }
                  wallet: { $ref: "#/components/schemas/Wallet" }
        default: { $ref: "#/components/responses/Error" }

  /progress:
    get:
      operationId: getProgress
      responses:
        "200":
          description: Campaign progress
          content:
            application/json:
              schema:
                type: object
                required: [currentLevel, levels, worldsCompleted]
                properties:
                  currentLevel: { type: integer }
                  levels:
                    type: array
                    items:
                      type: object
                      required: [id, bestStars, bestMoves]
                      properties:
                        id: { type: string }
                        bestStars: { type: integer }
                        bestMoves: { type: integer }
                  worldsCompleted:
                    type: array
                    items: { type: integer }
        default: { $ref: "#/components/responses/Error" }

  /continue:
    post:
      operationId: postContinue
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - type: object
                  required: [attemptId, method]
                  properties:
                    attemptId: { type: string }
                    method: { type: string, const: emeralds }
                - type: object
                  required: [attemptId, method, adIntentId]
                  properties:
                    attemptId: { type: string }
                    method: { type: string, const: ad }
                    adIntentId: { type: string }
      responses:
        "200":
          description: Continue granted
          content:
            application/json:
              schema:
                type: object
                required: [granted, bonusMoves, wallet]
                properties:
                  granted: { type: boolean }
                  bonusMoves: { type: integer }
                  wallet: { $ref: "#/components/schemas/Wallet" }
        default: { $ref: "#/components/responses/Error" }

  /daily/{date}:
    get:
      operationId: getDaily
      parameters:
        - name: date
          in: path
          required: true
          schema: { type: string, format: date }
      responses:
        "200":
          description: Daily level of the date
          content:
            application/json:
              schema:
                type: object
                required: [date, override, leaderboardPreview, me]
                properties:
                  date: { type: string, format: date }
                  override:
                    description: Level v2 (contracts/schemas/level.schema.json) or null
                    oneOf:
                      - type: "null"
                      - type: object
                  leaderboardPreview:
                    type: object
                    required: [top, median]
                    properties:
                      top:
                        description: Rows as in GET /leaderboards (Part 7 §6); the preview shape is not detailed in Part 7
                        type: array
                        items: { $ref: "#/components/schemas/LeaderboardRow" }
                      median: { type: number }
                  me:
                    type: object
                    required: [played]
                    properties:
                      played: { type: boolean }
                      result: { type: [string, "null"] }
                      rank: { type: [integer, "null"] }
        default: { $ref: "#/components/responses/Error" }

  /daily/history:
    get:
      operationId: getDailyHistory
      description: >
        PROPOSAL by the client team (decision 0017 #2), not in Part 7: the player's own daily
        results for the calendar of the last days.
      parameters:
        - name: days
          in: query
          required: true
          schema: { type: integer, minimum: 1, maximum: 30 }
      responses:
        "200":
          description: One entry per played or restored day, newest first
          content:
            application/json:
              schema:
                type: object
                required: [days]
                properties:
                  days:
                    type: array
                    items:
                      type: object
                      required: [date, result, stars, restored]
                      properties:
                        date: { type: string, format: date }
                        result: { type: [string, "null"], enum: [won, lost, null] }
                        stars: { type: [integer, "null"] }
                        restored: { type: boolean }
        default: { $ref: "#/components/responses/Error" }

  /streak:
    get:
      operationId: getStreak
      responses:
        "200":
          description: Streak state
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StreakState" }
        default: { $ref: "#/components/responses/Error" }

  /streak/restore:
    post:
      operationId: postStreakRestore
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - type: object
                  required: [method]
                  properties:
                    method: { type: string, const: emeralds }
                - type: object
                  required: [method, adIntentId]
                  properties:
                    method: { type: string, const: ad }
                    adIntentId: { type: string }
      responses:
        "200":
          description: Restored streak
          content:
            application/json:
              schema:
                type: object
                required: [streak, wallet]
                properties:
                  streak: { $ref: "#/components/schemas/Streak" }
                  wallet: { $ref: "#/components/schemas/Wallet" }
        default: { $ref: "#/components/responses/Error" }

  /shop:
    get:
      operationId: getShop
      responses:
        "200":
          description: Catalog for the player
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Shop" }
        default: { $ref: "#/components/responses/Error" }

  /shop/purchase:
    post:
      operationId: postShopPurchase
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - type: object
                  required: [itemId, expectedPrice]
                  properties:
                    itemId: { type: string }
                    expectedPrice: { $ref: "#/components/schemas/Price" }
                - type: object
                  required: [bundleId, expectedPrice]
                  properties:
                    bundleId: { type: string }
                    expectedPrice: { $ref: "#/components/schemas/Price" }
      responses:
        "200":
          description: Purchase granted
          content:
            application/json:
              schema:
                type: object
                required: [purchaseId, granted, wallet]
                properties:
                  purchaseId: { type: string }
                  granted:
                    type: array
                    items: { type: string }
                  wallet: { $ref: "#/components/schemas/Wallet" }
        default: { $ref: "#/components/responses/Error" }

  /inventory:
    get:
      operationId: getInventory
      responses:
        "200":
          description: Owned items with their descriptions (decision 0021 #2)
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/InventoryEntry" }
        default: { $ref: "#/components/responses/Error" }

  /loadout:
    put:
      operationId: putLoadout
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Loadout" }
      responses:
        "200":
          description: The whole loadout after the change
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Loadout" }
        default: { $ref: "#/components/responses/Error" }

  /ads/limits:
    get:
      operationId: getAdLimits
      description: Today's rewarded ad counters (decision 0025 #2, to agree with the backend).
      responses:
        "200":
          description: Counters per placement
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdLimits" }
        default: { $ref: "#/components/responses/Error" }

  /ads/intent:
    post:
      operationId: postAdIntent
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [placement]
              properties:
                placement: { $ref: "#/components/schemas/AdPlacement" }
                ref: { type: string, description: attemptId or eventId }
      responses:
        "200":
          description: Intent to show a rewarded ad
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdIntent" }
        default: { $ref: "#/components/responses/Error" }

  /ads/intent/{id}:
    get:
      operationId: getAdIntent
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Intent status after the SSV callback
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdIntentStatus" }
        default: { $ref: "#/components/responses/Error" }

components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer

  responses:
    Error:
      description: Error envelope (Part 7 §1, codes in §2)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }

  schemas:
    Platform:
      type: string
      enum: [ios, android]

    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code]
          properties:
            code: { $ref: "#/components/schemas/ErrorCode" }
            message: { type: string }
            details:
              type: object
              additionalProperties: true

    ErrorCode:
      type: string
      enum:
        - VALIDATION
        - UNAUTHORIZED
        - SESSION_REVOKED
        - BANNED
        - FORBIDDEN
        - NOT_FOUND
        - IDEMPOTENCY_MISMATCH
        - ALREADY_OWNED
        - IN_MATCH
        - ALREADY_QUEUED
        - NICK_TAKEN
        - NOT_OWNED
        - EMAIL_TAKEN
        - INVALID_CREDENTIALS
        - ACCOUNT_CONFLICT
        - INSUFFICIENT_FUNDS
        - OFFER_ENDED
        - SOLD_OUT
        - PRICE_CHANGED
        - LIMIT_REACHED
        - MAP_INVALID
        - ATTEMPT_REJECTED
        - STREAK_NOT_RESTORABLE
        - FRIENDS_LIMIT
        - LINK_REQUIRED
        - UPGRADE_REQUIRED
        - RATE_LIMITED
        - MAINTENANCE
        - INTERNAL

    Bootstrap:
      type: object
      required:
        [serverTime, version, maintenance, config, contentVersion, adsNetwork, dayKey, nextDayAt]
      properties:
        serverTime: { type: string, format: date-time }
        version:
          type: object
          required: [min, recommended, storeUrl]
          properties:
            min: { type: string }
            recommended: { type: string }
            storeUrl: { type: string }
            message: { type: string }
        maintenance:
          description: null when there is no maintenance; shape follows the MAINTENANCE error details
          oneOf:
            - type: "null"
            - type: object
              properties:
                until: { type: string, format: date-time }
                message: { type: string }
        config:
          type: object
          additionalProperties: true
        contentVersion: { type: string }
        adsNetwork: { type: string }
        dayKey: { type: string, format: date }
        nextDayAt: { type: string, format: date-time }

    TokenPair:
      type: object
      required: [accessToken, refreshToken, expiresIn]
      properties:
        accessToken: { type: string }
        refreshToken: { type: string }
        expiresIn: { type: integer }

    Session:
      allOf:
        - $ref: "#/components/schemas/TokenPair"
        - type: object
          required: [user]
          properties:
            user: { $ref: "#/components/schemas/SessionUser" }

    SessionUser:
      type: object
      required: [id, nickname, isGuest]
      properties:
        id: { type: string }
        nickname: { type: string }
        isGuest: { type: boolean }

    LoginResult:
      allOf:
        - $ref: "#/components/schemas/Session"
        - type: object
          required: [summary]
          properties:
            summary: { $ref: "#/components/schemas/AccountSummary" }

    AccountSummary:
      description: Shown on the account conflict cards (Part 7 §3 `details.other`)
      type: object
      required: [level, league, stars]
      properties:
        level: { type: integer }
        league: { type: [string, "null"], description: null without the arena }
        stars: { type: integer }

    RegisterRequest:
      type: object
      required: [nickname, email, password]
      properties:
        nickname: { type: string, minLength: 3, maxLength: 16 }
        email: { type: string, format: email }
        password: { type: string, minLength: 8 }

    LoginRequest:
      type: object
      required: [login, password]
      properties:
        login: { type: string, description: Nickname or e-mail }
        password: { type: string }

    RefreshRequest:
      type: object
      required: [refreshToken]
      properties:
        refreshToken: { type: string }

    Wallet:
      type: object
      required: [emeralds, coins]
      properties:
        emeralds: { type: integer }
        coins: { type: integer }

    Me:
      type: object
      required:
        [
          id,
          nickname,
          isGuest,
          providers,
          level,
          xp,
          xpToNext,
          wallet,
          arena,
          loadout,
          flags,
          friendCode,
        ]
      properties:
        id: { type: string }
        nickname: { type: string }
        isGuest: { type: boolean }
        providers:
          type: array
          items: { type: string }
        level: { type: integer }
        xp: { type: integer }
        xpToNext: { type: integer }
        wallet: { $ref: "#/components/schemas/Wallet" }
        arena:
          type: object
          required: [trophies, league, division, peak, rp, seasonId]
          properties:
            trophies: { type: integer }
            league: { type: string }
            division: { type: integer }
            peak: { type: integer }
            rp: { type: integer }
            seasonId: { type: integer }
        loadout: { $ref: "#/components/schemas/Loadout" }
        flags:
          type: object
          properties:
            nickChangeFreeAvailable: { type: boolean }
            nickChangeAvailableAt: { type: [string, "null"], format: date-time }
            deletionScheduledAt: { type: [string, "null"], format: date-time }
        friendCode: { type: string }

    Cell:
      type: array
      prefixItems:
        - { type: integer }
        - { type: integer }
      minItems: 2
      maxItems: 2

    Attempt:
      type: object
      required: [attemptId, mode, ref, taps, claimed]
      properties:
        attemptId: { type: string }
        mode: { type: string, enum: [campaign, daily] }
        ref: { type: string }
        contentVersion: { type: string }
        startedAt: { type: string, format: date-time }
        finishedAt: { type: string, format: date-time }
        durationMs: { type: integer }
        taps:
          type: array
          items: { $ref: "#/components/schemas/Cell" }
        continued: { type: boolean }
        continueMethod: { type: [string, "null"] }
        claimed:
          type: object
          required: [result, movesUsed, stars]
          properties:
            result: { type: string, enum: [won, lost] }
            movesUsed: { type: integer }
            stars: { type: [integer, "null"] }

    AttemptResult:
      type: object
      required: [attemptId, status]
      properties:
        attemptId: { type: string }
        status: { type: string, enum: [accepted, duplicate, corrected, rejected, late] }
        result: { type: string }
        stars: { type: [integer, "null"] }
        rewards:
          type: array
          items:
            type: object
            properties:
              currency: { type: string }
              amount: { type: integer }
              reason: { type: string }
              xp: { type: integer }
        daily:
          type: object
          properties:
            rank: { type: integer }
            percentile: { type: integer }
            ranked: { type: boolean }
        streak: { $ref: "#/components/schemas/Streak" }

    LeaderboardRow:
      type: object
      required: [rank, user, value]
      properties:
        rank: { type: integer }
        user:
          type: object
          required: [id, nickname]
          properties:
            id: { type: string }
            nickname: { type: string }
            avatar: { type: string }
            frame: { type: string }
            league: { type: string }
        value: { type: integer }

    Streak:
      type: object
      required: [current, best]
      properties:
        current: { type: integer }
        best: { type: integer }

    StreakState:
      type: object
      required: [current, best, lastDay, restorable]
      properties:
        current: { type: integer }
        best: { type: integer }
        lastDay: { type: string, format: date }
        restorable: { type: boolean }
        restoreUntil: { type: string, format: date-time }
        restoreMethods:
          type: array
          items: { type: string, enum: [ad, emeralds] }
        price: { type: integer }

    Price:
      description: Exactly one currency (decision 0021 #4)
      oneOf:
        - type: object
          required: [emeralds]
          properties:
            emeralds: { type: integer }
        - type: object
          required: [coins]
          properties:
            coins: { type: integer }

    Rarity:
      type: string
      enum: [common, rare, epic, legendary]

    Slot:
      description: Loadout slot keys (decision 0021 #3)
      type: string
      enum:
        [
          field,
          fence,
          stream,
          rock,
          x2,
          bridge,
          bomb,
          target,
          avatar,
          frame,
          badges,
          title,
          fxClick,
          fxReveal,
          fxVictory,
        ]

    ItemPackage:
      type: object
      required: [url, sha256, version]
      properties:
        url: { type: string }
        sha256: { type: string }
        version: { type: integer }

    ItemDescription:
      description: Name and description in the X-Locale language (decision 0021 #5)
      type: object
      required: [type, rarity, name, description, preview, package]
      properties:
        type: { type: string }
        rarity: { $ref: "#/components/schemas/Rarity" }
        name: { type: string }
        description: { type: string }
        preview: { type: string }
        package: { $ref: "#/components/schemas/ItemPackage" }

    ShopItem:
      allOf:
        - $ref: "#/components/schemas/ItemDescription"
        - type: object
          required: [id, slot, price, availableTo, stockLeft, owned, equipped, visibleInMatch]
          properties:
            id: { type: string }
            slot: { $ref: "#/components/schemas/Slot" }
            visibleInMatch: { type: boolean, description: "Decision 0022 #2" }
            price: { $ref: "#/components/schemas/Price" }
            availableTo: { type: [string, "null"], format: date-time }
            stockLeft: { type: [integer, "null"] }
            owned: { type: boolean }
            equipped: { type: boolean }

    ShopTab:
      type: object
      required: [id, items]
      properties:
        id:
          type: string
          enum: [exclusive, holiday, elements, fields, profile, effects]
        items:
          type: array
          items: { $ref: "#/components/schemas/ShopItem" }

    Bundle:
      description: >
        Name, description, rarity and preview are added for the bundle card, as for items
        (decision 0021 #11).
      type: object
      required:
        [id, name, description, rarity, preview, items, basePrice, price, ownedItems, availableTo]
      properties:
        id: { type: string }
        name: { type: string }
        description: { type: string }
        rarity: { $ref: "#/components/schemas/Rarity" }
        preview: { type: string }
        items:
          type: array
          items: { type: string }
        basePrice: { $ref: "#/components/schemas/Price" }
        price: { $ref: "#/components/schemas/Price" }
        ownedItems:
          type: array
          items: { type: string }
        availableTo: { type: [string, "null"], format: date-time }

    Featured:
      type: object
      required: [id, image, title, subtitle, endsAt, target]
      properties:
        id: { type: string }
        image: { type: string }
        title: { type: string }
        subtitle: { type: string }
        endsAt: { type: string, format: date-time }
        target:
          oneOf:
            - type: object
              required: [bundle]
              properties:
                bundle: { type: string }
            - type: object
              required: [item]
              properties:
                item: { type: string }

    Shop:
      type: object
      required: [featured, tabs, bundles, cacheTtlSec]
      properties:
        featured:
          oneOf:
            - type: "null"
            - $ref: "#/components/schemas/Featured"
        tabs:
          type: array
          items: { $ref: "#/components/schemas/ShopTab" }
        bundles:
          type: array
          items: { $ref: "#/components/schemas/Bundle" }
        cacheTtlSec: { type: integer }

    InventoryEntry:
      type: object
      required: [itemId, slot, acquiredAt, source, item]
      properties:
        itemId: { type: string }
        slot: { $ref: "#/components/schemas/Slot" }
        acquiredAt: { type: string, format: date-time }
        source: { type: string }
        item: { $ref: "#/components/schemas/ItemDescription" }

    Loadout:
      description: Every slot is optional, so PUT sends only the changed ones; null is the default item
      type: object
      properties:
        field: { type: [string, "null"] }
        fence: { type: [string, "null"] }
        stream: { type: [string, "null"] }
        rock: { type: [string, "null"] }
        x2: { type: [string, "null"] }
        bridge: { type: [string, "null"] }
        bomb: { type: [string, "null"] }
        target: { type: [string, "null"] }
        avatar: { type: [string, "null"] }
        frame: { type: [string, "null"] }
        badges:
          type: array
          maxItems: 3
          items: { type: string }
        title: { type: [string, "null"] }
        fxClick: { type: [string, "null"] }
        fxReveal: { type: [string, "null"] }
        fxVictory: { type: [string, "null"] }

    AdPlacement:
      type: string
      enum: [gems, continue, double, streak, event]

    AdLimit:
      type: object
      required: [used, max, resetAt]
      properties:
        used: { type: integer }
        max: { type: integer }
        resetAt: { type: string, format: date-time }

    AdLimits:
      type: object
      required: [gems, continue, streak]
      properties:
        gems: { $ref: "#/components/schemas/AdLimit" }
        continue: { $ref: "#/components/schemas/AdLimit" }
        streak: { $ref: "#/components/schemas/AdLimit" }

    AdIntent:
      type: object
      required: [adIntentId, customData, network, unitId, leftToday]
      properties:
        adIntentId: { type: string }
        customData: { type: string }
        network: { type: string }
        unitId: { type: string }
        leftToday: { type: integer }

    AdIntentStatus:
      description: For continue and streak the reward is the right to call that endpoint with the intent (Part 7 §6)
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [pending, rewarded, expired]
        reward:
          type: object
          required: [currency, amount]
          properties:
            currency: { type: string, enum: [emerald, coin] }
            amount: { type: integer }
        wallet: { $ref: "#/components/schemas/Wallet" }
