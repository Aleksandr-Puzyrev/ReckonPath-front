        gameId: { type: string }
        status: { type: string, enum: [play, lost, won, abandoned] }
        attempts: { type: integer }
        nextDayAt: { type: string, format: date-time }

    DailyRewards:
      type: object
      required: [coins, coinsPerStar, xp, topSize, topGems]
      properties:
        coins: { type: integer }
        coinsPerStar: { type: integer }
        xp: { type: integer }
        topSize: { type: integer }
        topGems: { type: integer }

    DailyOverview:
      type: object
      required: [day, streak, rewards]
      properties:
        day: { $ref: "#/components/schemas/DailyDay" }
        streak: { $ref: "#/components/schemas/StreakView" }
        rewards: { $ref: "#/components/schemas/DailyRewards" }

    DailyHistoryDay:
      type: object
      required: [date, stars, moves, attempts]
      properties:
        date: { type: string, format: date }
        stars: { type: integer }
        moves: { type: integer }
        attempts: { type: integer }

    DailyLeaderboard:
      type: object
      required: [date, entries]
      properties:
        date: { type: string, format: date }
        entries:
          type: array
          items: { $ref: "#/components/schemas/DailyEntry" }
        mine: { $ref: "#/components/schemas/DailyEntry" }

    StreakMilestone:
      type: object
      required: [days, gems, reached]
      properties:
        days: { type: integer }
        gems: { type: integer }
        reached: { type: boolean }

    StreakView:
      type: object
      required: [current, best, todayDone, restorable, restoreCost, milestones]
      properties:
        current: { type: integer }
        best: { type: integer }
        lastDay: { type: string, format: date }
        todayDone: { type: boolean }
