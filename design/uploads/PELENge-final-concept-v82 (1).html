function go(v){state.view=v;render();window.scrollTo({top:0,behavior:'smooth'})}
function toast(s){const x=document.getElementById('toast');x.textContent=s;x.classList.add('show');clearTimeout(window.__toast);window.__toast=setTimeout(()=>x.classList.remove('show'),1500)}
function board(kind='normal',interactive=false){let out='';for(let i=0;i<49;i++){let cls='cell';if(kind==='water'&&(i%7===2||i%7===3))cls+=' target';if(kind==='rocks'&&[10,11,31].includes(i))cls+=' target';if(kind==='night'&&i===33)cls+=' target';out+=`<button class="${cls}" ${interactive?`onclick="tapCell(${i},this)"`:''}><span class="num">${(i%7)+1}</span></button>`}return `<div class="board">${out}</div>`}
function tapCell(i,el){if(el.classList.contains('revealed'))return;el.classList.add('revealed');const n=(i%7)+1;el.querySelector('.num').textContent=n;if(n<=2)el.classList.add('hot');if(n===1){el.classList.add('target');toast('SIGNAL FOUND')}else toast(n<=3?'HOT':'WARM')}
function home(){main.innerHTML=`<section class="view"><div class="hero"><div class="heroHead"><div><div class="eyebrow" style="color:#a9fbff">ТЕКУЩАЯ ИГРА</div><h1>Уровень ${state.current}</h1><div class="meta">${levels[state.current-1]} · найди скрытый сигнал</div></div><span class="pill">${Math.max(3,8-state.current%5)} ХОДОВ</span></div>${board('normal',true)}<div class="heroCta"><span class="pill">SIGNAL HUNT</span><button class="btn primary" onclick="startLevel(${state.current})">ИГРАТЬ</button></div></div><div class="homeLinks"><button onclick="go('arena')">АРЕНА <span style="color:var(--muted)">PvP</span></button><button onclick="go('shop')">ВИТРИНА <span style="color:var(--muted)">COLLECTION</span></button></div><section class="section"><div class="sectionHead"><b>СЕГОДНЯ</b><span>быстрый обзор</span></div><div class="statgrid"><div class="stat"><b>СЕРИЯ</b><strong>7</strong></div><div class="stat"><b>КУБКИ</b><strong>2 640</strong></div><div class="stat"><b>ТОП</b><strong>#42</strong></div></div></section></section>`}
function levelsPage(){let h='<section class="view"><div class="levelsHead"><div><div class="eyebrow">ПУТЬ СИГНАЛА</div><h1>Уровни</h1></div><div class="count">29 / 29</div></div>';const ch=[['НАЧАЛО',1,4],['ПРЕПЯТСТВИЯ',5,7],['ВОДА',8,10],['КОМБИНАЦИИ',11,19],['МАСТЕРСТВО',20,23],['АРЕНА',24,29]];ch.forEach(c=>{h+=`<div class="chapter">${c[0]} · ${c[1]}–${c[2]}</div>`;for(let n=c[1];n<=c[2];n++){let done=n<=state.completed,cur=n===state.current;h+=`<button class="level ${done?'done ':''}${cur?'current ':''}" onclick="startLevel(${n})"><span class="levelNum">${done?'✓':String(n).padStart(2,'0')}</span><span class="levelCopy"><b>${levels[n-1]}</b><span>${desc[n-1]}</span></span><span class="status">${cur?'ИГРАТЬ':'ОТКРЫТЬ'}</span></button>`}});h+='</section>';main.innerHTML=h}
function startLevel(n){state.current=n;go('home');toast('Уровень '+n+' открыт')}
function miniBoard(kind){let c='';for(let i=0;i<49;i++){let bg=kind==='night'?'#28506b':kind==='water'?'#36bfd1':kind==='rock'?'#657481':kind==='heavy'?'#c38a3e':kind==='bridge'?'#9c6c3d':kind==='aurora'?'#6a72c9':'#4b8d80';c+=`<i style="background:${bg}"></i>`}return `<div class="miniBoard">${c}</div>`}
function productVisual(kind){if(kind==='avatar')return '<div class="avatar">P</div>';if(kind==='frame')return '<div class="framePreview"><div class="avatar">P</div></div>';if(['click','reveal','victory'].includes(kind))return '<div class="fxPreview"><span class="fxCore"></span></div>';if(kind==='badge')return '<div class="badge" style="font-size:10px;padding:12px">CHAMPION</div>';if(kind==='title')return '<div style="font-size:14px;font-weight:1000;letter-spacing:1px">MASTER</div>';return miniBoard(kind)}
function shop(){const tabs=[['exclusive','ЭКСКЛЮЗИВ'],['holiday','ПРАЗДНИЧНОЕ'],['elements','ЭЛЕМЕНТЫ'],['fields','ПОЛЯ'],['sets','НАБОРЫ'],['profile','ПРОФИЛЬ'],['effects','ЭФФЕКТЫ']];let visible=products.filter(p=>state.tab==='exclusive'?p[4]==='EXCLUSIVE':state.tab==='holiday'?p[4]==='HOLIDAY':state.tab==='elements'?p[1]==='ELEMENT':state.tab==='fields'?p[1]==='FIELD':state.tab==='sets'?p[1]==='SET':state.tab==='profile'?['AVATAR','FRAME','BADGE','TITLE'].includes(p[1]):['CLICK FX','REVEAL FX','VICTORY FX'].includes(p[1]));main.innerHTML=`<section class="view"><div class="shopHero"><div class="eyebrow" style="color:#b7fbff">ВИТРИНА</div><h1>Собери свой сигнал.</h1><p>Косметика меняет поле, профиль и ощущения от каждого нажатия. Игровой результат остаётся честным.</p>${board('night',false)}</div><div class="shopFeature"><div class="shopFeatureTop"><div><div class="eyebrow">LIMITED DROP</div><h2>STORM SIGNAL</h2><p>Праздничный набор: поле, забор, ручей и победный эффект.</p></div><span class="featureTag">6 ДНЕЙ</span></div><button class="btn primary" style="margin-top:10px" onclick="shopTab('holiday')">ОТКРЫТЬ НАБОР</button></div><div class="tabs">${tabs.map(x=>`<button class="${state.tab===x[0]?'active':''}" onclick="shopTab('${x[0]}')">${x[1]}</button>`).join('')}</div><section class="section"><div class="sectionHead"><b>${tabs.find(x=>x[0]===state.tab)[1]}</b><span>${visible.length} предметов</span></div><div class="shelf">${visible.map(p=>`<button class="product" onclick="preview('${p[0]}','${p[1]}','${p[2]}','${p[3]}')"><div class="productArt">${productVisual(p[3])}</div><div class="productInfo"><b>${p[0]}</b><span>${p[1]} · видно в матче</span><div class="price">◆ ${p[2]}</div></div></button>`).join('')}</div></section><section class="section"><div class="sectionHead"><b>ЭЛЕМЕНТЫ ПОЛЯ</b><span>покупай и экипируй</span></div><div class="statgrid"><div class="stat"><b>ЗАБОРЫ</b><strong>12</strong></div><div class="stat"><b>РУЧЬИ</b><strong>9</strong></div><div class="stat"><b>БЛОКИ</b><strong>7</strong></div></div><button class="btn primary" style="margin-top:9px;width:100%" onclick="shopTab('elements')">СМОТРЕТЬ ЭЛЕМЕНТЫ</button></section></section>`}
function shopTab(t){state.tab=t;render()}
function preview(name,type,price,kind){main.insertAdjacentHTML('beforeend',`<div class="modal" id="modal"><div class="sheet"><div class="eyebrow">${type}</div><h2>${name}</h2><p>Предмет можно экипировать в коллекции. В PvP он меняет только визуальный стиль карты и эффектов.</p><div style="display:grid;place-items:center;margin:14px">${productVisual(kind)}</div><div class="sheetActions"><button class="btn ghost" onclick="document.getElementById('modal').remove()">ЗАКРЫТЬ</button><button class="btn primary" onclick="document.getElementById('modal').remove();toast('${name} добавлен в коллекцию')">◆ ${price}</button></div></div></div>`)}
function arena(){main.innerHTML=`<section class="view"><div class="arenaHero"><div class="eyebrow" style="color:#b7fbff">ARENA</div><h1>Сигнал против сигнала.</h1><p>Перед матчем каждый игрок настраивает свою карту: цели, заборы, ручьи, блоки и мосты. Визуальные стили берутся из коллекции.</p><div class="arenaStats"><div class="arenaStat"><b>КУБКИ</b><strong>2 640</strong></div><div class="arenaStat"><b>ЛИГА</b><strong>GOLD II</strong></div><div class="arenaStat"><b>СЕЗОН</b><strong>07</strong></div></div></div><div class="arenaSetup"><div class="sectionHead"><b>ПОДГОТОВИТЬ КАРТУ</b><span>до матча</span></div><div class="setupRow"><div><div class="setupLabel">ЦЕЛЕЙ</div><select class="setupSelect" onchange="state.arenaTargets=+this.value"><option>1</option><option selected>2</option><option>3</option><option>4</option><option>5</option></select></div><div><div class="setupLabel">ЗАБОРОВ</div><select class="setupSelect" onchange="state.arenaFences=+this.value"><option>0</option><option>1</option><option>2</option><option selected>3</option><option>5</option></select></div></div><div class="setupRow"><div><div class="setupLabel">×2 БЛОКОВ</div><select class="setupSelect" onchange="state.arenaBlocks=+this.value"><option>0</option><option>1</option><option selected>2</option><option>3</option></select></div><div><div class="setupLabel">РУЧЬЁВ</div><select class="setupSelect" onchange="state.arenaWater=+this.value"><option>0</option><option>1</option><option selected>2</option><option>3</option></select></div></div>${arenaBuilderBoard()}<div class="setupTools">${[['target','ЦЕЛЬ'],['fence','ЗАБОР'],['water','РУЧЕЙ'],['heavy','×2 БЛОК'],['rock','СКАЛА'],['bridge','МОСТ'],['erase','СТЕРЕТЬ'],['random','RANDOM']].map(t=>`<button class="setupTool ${state.arenaTool===t[0]?'active':''}" onclick="arenaTool('${t[0]}')">${t[1]}</button>`).join('')}</div><div class="arenaActions"><button class="btn primary" onclick="saveArenaMap()">СОХРАНИТЬ КАРТУ</button><button class="btn ghost" onclick="randomArenaMap()">СЛУЧАЙНО</button></div></div><section class="section"><div class="sectionHead"><b>ЛИДЕРЫ</b><span>неделя</span></div><div class="rank">${[['1','Nova','3 820'],['2','Kira','3 710'],['3','Milo','3 640'],['42','Ты','2 640'],['43','Lena','2 621']].map((r,i)=>`<div class="rankRow"><span>${r[0]}</span><div style="display:flex;gap:7px;align-items:center"><div class="avatarMini">${r[1][0]}</div><div><b>${r[1]}</b><small>${i===3?'твоя позиция':'сигналы найдены'}</small></div></div><strong>${r[2]}</strong></div>`).join('')}</div></section></section>`}
function arenaBuilderBoard(){let cells='';for(let i=0;i<49;i++){const k=state.arenaMap[i];cells+=`<button class="abCell ${k||''}" onclick="arenaCell(${i})"></button>`}return `<div class="arenaBuilderBoard">${cells}${state.arenaFencesMap.map(f=>f.o==='v'?`<span class="fenceV" style="left:calc(${f.c*14.285}% + ${f.c*0.7}px)"></span>`:`<span class="fenceH" style="top:calc(${f.r*14.285}% + ${f.r*0.7}px)"></span>`).join('')}</div>`}
function arenaTool(t){if(t==='random'){randomArenaMap();return}state.arenaTool=t;render()}
function arenaCell(i){if(state.arenaTool==='fence'){const r=Math.floor(i/7),c=i%7;state.arenaFencesMap.push({r,c,o:(c+r)%2?'v':'h'});toast('Забор размещён');render();return}if(state.arenaTool==='erase'){state.arenaMap[i]=null;toast('Элемент убран')}else{state.arenaMap[i]=state.arenaTool;toast(state.arenaTool==='target'?'Цель поставлена':'Элемент размещён')}render()}
function randomArenaMap(){state.arenaMap=Array(49).fill(null);state.arenaFencesMap=[];[8,20,34].slice(0,state.arenaTargets).forEach(i=>state.arenaMap[i]='target');[10,17,29].slice(0,state.arenaBlocks).forEach(i=>state.arenaMap[i]='heavy');[13,14,15,27,28].slice(0,state.arenaWater+1).forEach(i=>state.arenaMap[i]='water');toast('Карта создана');render()}
function saveArenaMap(){toast('Карта сохранена для будущего матча')}
function profile(){main.innerHTML=`<section class="view"><div class="profileHero"><div class="avatar">P</div><div><div class="eyebrow">PROFILE</div><h1>PELENGE Player</h1><p>Уровень 18 · GOLD II · 2 640 кубков</p><div class="badgeRow"><span class="badge">SIGNAL FINDER</span><span class="badge">7 DAY STREAK</span><span class="badge">EARLY EXPLORER</span></div></div></div><section class="section"><div class="sectionHead"><b>СТАТИСТИКА</b><span>сейчас</span></div><div class="statgrid"><div class="stat"><b>УРОВНИ</b><strong>29</strong></div><div class="stat"><b>ПОБЕДЫ</b><strong>37</strong></div><div class="stat"><b>СЕРИЯ</b><strong>7</strong></div></div></section><section class="section"><div class="sectionHead"><b>КОЛЛЕКЦИЯ</b><span>косметика</span></div><div class="collection">${['FIELD','FENCE','WATER','ROCK','×2','AVATAR','FRAME','FX'].map(x=>`<button onclick="go('shop');toast('${x} · коллекция')"><i>${x}</i><b>ОТКРЫТЬ</b></button>`).join('')}</div></section><section class="section"><button class="btn ghost" style="width:100%" onclick="go('settings')">НАСТРОЙКИ ПРОФИЛЯ</button></section></section>`}
function events(){main.innerHTML=`<section class="view"><div class="event"><div class="eyebrow" style="color:#b7fbff">LIVE EVENT</div><h1>Storm Signal</h1><p>Собирай event tokens, проходи короткие карты и открывай временную коллекцию.</p><div class="eventBar"><i></i></div><div style="display:flex;justify-content:space-between;margin-top:6px;font-size:6px"><span>680 / 1000</span><span>6 дней</span></div></div><section class="section"><div class="sectionHead"><b>НАГРАДЫ</b><span>event track</span></div><div class="eventGrid">${[['120','EVENT TOKENS'],['FRAME','STORM FRAME'],['FX','THUNDER REVEAL'],['◆ 240','EMERALDS']].map(r=>`<div class="reward"><b>${r[0]}</b><span>${r[1]}</span></div>`).join('')}</div></section><section class="section"><button class="btn primary" onclick="go('shop');shopTab('holiday')">СМОТРЕТЬ ПРАЗДНИЧНУЮ КОЛЛЕКЦИЮ</button></section></section>`}
function builder(){main.innerHTML=`<section class="view"><div class="sectionHead"><div><div class="eyebrow">BUILDER</div><h1 style="font-size:29px;letter-spacing:-1px;margin-top:5px">Собери поле</h1></div><span>косметика</span></div>${board('normal',true)}<div class="builderTools">${[['target','Цель','скрытая'],['fence','Забор','между клетками'],['water','Вода','стиль ручья'],['rock','Скала','блок'],['heavy','×2 блок','материал'],['bridge','Мост','переход']].map(t=>`<button class="tool ${state.selectedTool===t[0]?'active':''}" onclick="state.selectedTool='${t[0]}';render()"><b>${t[1]}</b><span>${t[2]}</span></button>`).join('')}</div><div class="section"><button class="btn primary" onclick="toast('Сет сохранён в коллекции')">СОХРАНИТЬ СЕТ</button></div></section>`}
function settings(){main.innerHTML=`<section class="view"><div class="eyebrow">SETTINGS</div><h1 style="font-size:29px;margin-top:5px">Настройки</h1>${[['Звук','Вкл.'],['Музыка','Вкл.'],['Уведомления','Вкл.'],['Язык','Русский'],['Аккаунт','Защищён']].map(r=>`<div class="settingsRow"><b>${r[0]}</b><span>${r[1]}</span></div>`).join('')}<div class="section"><button class="btn ghost" onclick="go('events')">СОБЫТИЯ</button></div></section>`}
function render(){document.documentElement.classList.toggle('dark',state.theme==='dark');document.getElementById('lightBtn').classList.toggle('active',state.theme==='light');document.getElementById('darkBtn').classList.toggle('active',state.theme==='dark');document.querySelectorAll('#bottom button').forEach(b=>b.classList.toggle('active',b.dataset.view===state.view));({home,levels:levelsPage,arena,shop,profile,events,builder,settings}[state.view]||home)()}
render();
</script>
</body></html>
